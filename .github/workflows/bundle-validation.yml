name: Private internal installers and validation

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONUTF8: '1'
  SHANGZIMU_PRIVATE_REPOSITORY: ${{ github.event.repository.private }}

concurrency:
  group: bundled-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mac:
    if: github.event_name == 'workflow_dispatch' && github.repository == 'ternence503/shangzimu-builds' && github.event.repository.private == true
    name: Mac ${{ matrix.arch }} build and offline probe
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15-intel
            arch: x86_64
          - runner: macos-15
            arch: arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install native build-only dependencies
        run: |
          python -m pip install --only-binary=:all: -r packaging/windows/requirements-build.txt
          brew install ffmpeg
          python -m pip check
          python -m pip freeze > "$RUNNER_TEMP/dependency-lock.txt"
      - name: Unit and packaging contract tests
        run: |
          python -m unittest discover -s tests -q
          python -m unittest discover -s packaging/windows -p 'test*.py' -q
      - name: Prepare public model and resources
        run: python packaging/ci_prepare.py "$RUNNER_TEMP/resources" --tools "$(dirname "$(command -v ffmpeg)")"
      - name: Build native app
        run: python packaging/mac/build.py --model "$RUNNER_TEMP/resources/models/faster-small" --tools "$RUNNER_TEMP/resources/bin" --dist "$RUNNER_TEMP/dist" --work "$RUNNER_TEMP/freeze" --arch '${{ matrix.arch }}'
      - name: Native dependency closure review
        run: python packaging/mac/check_dependencies.py "$RUNNER_TEMP/dist/上字幕.app" --pyinstaller
      - name: Generate non-private local speech fixture
        run: |
          say -o "$RUNNER_TEMP/speech.aiff" 'Hello. Welcome to the subtitle tool. This recording is generated locally to test offline speech recognition.'
          test -s "$RUNNER_TEMP/speech.aiff"
      - name: Relocated offline recognition and signature validation
        run: python packaging/mac/relocation_test.py "$RUNNER_TEMP/dist/上字幕.app" "$RUNNER_TEMP/speech.aiff" "$RUNNER_TEMP/probe.json"
      - name: Require actual speech recognition evidence
        run: python -c 'import json,os; r=json.load(open(os.path.join(os.environ["RUNNER_TEMP"],"probe.json"))); assert r["speech_transcribed_and_srt_exported"] and r["adhoc_signature_verified"] and r["returncode"]==0'
      - name: Build internal installer only after probe passes
        run: python packaging/mac/installer.py "$RUNNER_TEMP/dist/上字幕.app" "$RUNNER_TEMP/internal.pkg"
      - name: Install on disposable runner and execute actual Applications app
        run: |
          test ! -e '/Applications/上字幕.app'
          sudo /usr/sbin/installer -pkg "$RUNNER_TEMP/internal.pkg" -target /
          python packaging/mac/relocation_test.py '/Applications/上字幕.app' "$RUNNER_TEMP/speech.aiff" "$RUNNER_TEMP/installed-probe.json" --in-place
          /System/Library/Frameworks/CoreServices.framework/Frameworks/LaunchServices.framework/Support/lsregister -f '/Applications/上字幕.app'
      - name: Record limitations
        run: |
          echo 'Native build, runner installation and offline execution probe; not Developer ID notarization or end-user GUI search/reboot acceptance.' >> "$GITHUB_STEP_SUMMARY"
          echo 'Private internal installer artifacts only. No Release, tags or standalone audio/model artifacts. Not cleared for redistribution.' >> "$GITHUB_STEP_SUMMARY"
      - name: Stage explicit internal installer and evidence
        run: python packaging/private_delivery.py --platform 'mac-${{ matrix.arch }}' --installer "$RUNNER_TEMP/internal.pkg" --resources "$RUNNER_TEMP/resources" --lock "$RUNNER_TEMP/dependency-lock.txt" --report "$RUNNER_TEMP/probe.json" --report "$RUNNER_TEMP/installed-probe.json" --output "$RUNNER_TEMP/private-delivery"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: internal-unnotarized-not-for-redistribution-mac-${{ matrix.arch }}-${{ github.run_id }}
          path: ${{ runner.temp }}/private-delivery/*
          retention-days: 7
          compression-level: 0
          if-no-files-found: error

  windows:
    if: github.event_name == 'workflow_dispatch' && github.repository == 'ternence503/shangzimu-builds' && github.event.repository.private == true
    runs-on: windows-2022
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install native build-only dependencies
        shell: pwsh
        run: |
          python -m pip install --only-binary=:all: -r packaging/windows/requirements-build.txt
          if ($LASTEXITCODE -ne 0) { throw 'Build dependency install failed' }
          python -m pip freeze > "$env:RUNNER_TEMP\resolved-build-lock.txt"
          if ($LASTEXITCODE -ne 0) { throw 'Resolved dependency lock failed' }
          choco install ffmpeg --yes --no-progress
          if ($LASTEXITCODE -ne 0) { throw 'FFmpeg install failed' }
          choco install innosetup --version=6.7.1 --yes --no-progress
          if ($LASTEXITCODE -ne 0) { throw 'Build tools install failed' }
      - name: Unit and packaging contract tests
        shell: pwsh
        run: |
          python -m unittest discover -s tests -q
          if ($LASTEXITCODE -ne 0) { throw 'Unit tests failed' }
          python -m unittest discover -s packaging/windows -p 'test*.py' -q
          if ($LASTEXITCODE -ne 0) { throw 'Packaging tests failed' }
      - name: Prepare resources and local speech fixture
        shell: pwsh
        run: |
          $tool = Get-ChildItem 'C:\ProgramData\chocolatey\lib\ffmpeg' -Filter ffmpeg.exe -Recurse | Select-Object -First 1
          if (-not $tool) { throw 'Native ffmpeg executable missing' }
          python packaging/ci_prepare.py "$env:RUNNER_TEMP\resources" --tools $tool.Directory.FullName
          if ($LASTEXITCODE -ne 0) { throw 'Resource preparation failed' }
          Add-Type -AssemblyName System.Speech
          $voice = New-Object System.Speech.Synthesis.SpeechSynthesizer
          $voice.SetOutputToWaveFile("$env:RUNNER_TEMP\speech.wav")
          $voice.Speak('Hello. Welcome to the subtitle tool. This recording is generated locally to test offline speech recognition.')
          $voice.Dispose()
      - name: Build and execute actual frozen app
        shell: pwsh
        run: |
          $env:SHANGZIMU_TEST_AUDIO = "$env:RUNNER_TEMP\speech.wav"
          $python = (Get-Command python).Source
          $compiler = 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe'
          ./packaging/windows/Build.ps1 -PythonExe $python -PreparedResources "$env:RUNNER_TEMP\resources" -InnoCompiler $compiler -Version '1.4.1' -BuildRoot "$env:RUNNER_TEMP\native-build" -ResolvedDependencyLock "$env:RUNNER_TEMP\resolved-build-lock.txt"
          $report = Get-Content "$env:RUNNER_TEMP\native-build\frozen-self-test.json" -Raw | ConvertFrom-Json
          if (-not $report.speech_transcribed_and_srt_exported) { throw 'Actual speech recognition and SRT evidence required' }
      - name: Audit bundled Windows native dependencies
        shell: pwsh
        run: |
          $bundle = "$env:RUNNER_TEMP\native-build\dist\上字幕"
          $auditArguments = @('packaging/windows/check_dependencies.py', $bundle)
          # NumPy and PyAV wheel loaders use these exact package DLL directories.
          # Never search all bundle subdirectories or borrow the runner's MSVC runtime.
          foreach ($relative in @('_internal/numpy.libs', '_internal/av.libs')) {
            if (Test-Path -LiteralPath (Join-Path $bundle $relative) -PathType Container) {
              $auditArguments += @('--dll-directory', $relative)
            }
          }
          python @auditArguments
          if ($LASTEXITCODE -ne 0) { throw 'Windows native dependency audit failed' }
      - name: Relocate and execute complete Windows app
        shell: pwsh
        run: ./packaging/windows/relocation_test.ps1 -BundleDir "$env:RUNNER_TEMP\native-build\dist\上字幕" -SpeechFile "$env:RUNNER_TEMP\speech.wav" -ReportFile "$env:RUNNER_TEMP\windows-relocation.json" -EnableFirewallProfilesForDisposableCI
      - name: Install on disposable runner and verify start-menu shortcut
        shell: pwsh
        run: |
          $appDir = Join-Path ([Environment]::GetFolderPath('LocalApplicationData')) 'Programs\ShangZiMu'
          if (Test-Path -LiteralPath $appDir) { throw 'Existing installation must not be overwritten in this test' }
          $installers = @(Get-ChildItem "$env:RUNNER_TEMP\native-build\release" -Filter '*.exe')
          if ($installers.Count -ne 1) { throw 'Exactly one installer required' }
          $unrelated = "$env:RUNNER_TEMP\unrelated-install-target"
          New-Item -ItemType Directory -Path $unrelated | Out-Null
          $sentinel = Join-Path $unrelated 'existing.txt'
          Set-Content -LiteralPath $sentinel -Value 'must remain untouched'
          $rejected = Start-Process -FilePath $installers[0].FullName -ArgumentList @('/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART','/SP-', ('/DIR="' + $unrelated + '"')) -Wait -PassThru
          if ($rejected.ExitCode -eq 0 -or (Get-Content -LiteralPath $sentinel -Raw).Trim() -ne 'must remain untouched' -or (Get-ChildItem -LiteralPath $unrelated).Count -ne 1) { throw 'Unrelated installation target protection failed' }
          $process = Start-Process -FilePath $installers[0].FullName -ArgumentList @('/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART','/SP-') -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw 'Installer failed' }
          $shortcutPath = Join-Path ([Environment]::GetFolderPath('Programs')) '上字幕.lnk'
          if (-not (Test-Path -LiteralPath $shortcutPath)) { throw 'Start-menu shortcut missing' }
          $shell = New-Object -ComObject WScript.Shell
          $shortcut = $shell.CreateShortcut($shortcutPath)
          $expectedTarget = Join-Path $appDir '上字幕.exe'
          Write-Output ('WSH diagnostic target: ' + $shortcut.TargetPath)
          Write-Output ('Shortcut bytes: ' + (Get-Item -LiteralPath $shortcutPath).Length)
          if (-not (Test-Path -LiteralPath $expectedTarget -PathType Leaf)) { throw 'Installed executable missing' }
          # Read the installed shortcut through the Windows Shell Unicode interface,
          # independently of WSH, which returned an empty path in the prior run.
          $explorerShell = New-Object -ComObject Shell.Application
          $folder = $explorerShell.NameSpace([IO.Path]::GetDirectoryName($shortcutPath))
          $item = $folder.ParseName([IO.Path]::GetFileName($shortcutPath))
          if (-not $item -or -not $item.IsLink) { throw 'Installed shortcut is not a Shell link' }
          $nativeLink = $item.GetLink
          $actualTarget = $nativeLink.Path
          Write-Output ('Windows Shell actual target: ' + $actualTarget)
          Write-Output ('Expected installed executable: ' + $expectedTarget)
          python -c 'import os,sys; assert os.path.samefile(sys.argv[1],sys.argv[2]), "Shortcut must target the actual installed file"' $actualTarget $expectedTarget
          if ($LASTEXITCODE -ne 0) { throw 'Start-menu shortcut target incorrect' }
          $env:WHISPER_PREVIEW_DATA_DIR = "$env:RUNNER_TEMP\installed-progress"
          $env:SHANGZIMU_TEST_AUDIO = "$env:RUNNER_TEMP\speech.wav"
          $reportPath = "$env:RUNNER_TEMP\installed-probe.json"
          # Launch the actual .lnk with ShellExecute, not a substituted EXE path.
          $startInfo = [Diagnostics.ProcessStartInfo]::new()
          $startInfo.FileName = $shortcutPath
          $startInfo.UseShellExecute = $true
          $startInfo.WorkingDirectory = $appDir
          $startInfo.Arguments = '--self-test "' + $reportPath + '"'
          $process = [Diagnostics.Process]::Start($startInfo)
          if (-not $process) { throw 'Shortcut launch did not provide a process handle' }
          if (-not $process.WaitForExit(120000)) { $process.Kill(); throw 'Shortcut launch timed out' }
          if ($process.ExitCode -ne 0) { throw 'Installed application failed' }
          $report = Get-Content -LiteralPath $reportPath -Raw | ConvertFrom-Json
          if ($report.status -ne 'passed' -or -not $report.speech_transcribed_and_srt_exported) { throw 'Installed speech and SRT evidence required' }
      - name: Record limitations
        shell: pwsh
        run: |
          'Native build, runner installation, shortcut target and speech/SRT probes; not GUI search, reboot, SmartScreen or end-user acceptance. Relocation requires a real unpatched before/after application firewall probe; arbitrary subprocess network behavior is not covered.' >> $env:GITHUB_STEP_SUMMARY
          'Private internal installer artifacts only. No Release, tags or standalone audio/model artifacts. Not cleared for redistribution.' >> $env:GITHUB_STEP_SUMMARY
      - name: Stage explicit internal installer and evidence
        shell: pwsh
        run: |
          $installers = @(Get-ChildItem "$env:RUNNER_TEMP\native-build\release" -Filter '*.exe')
          if ($installers.Count -ne 1) { throw 'Exactly one installer required for staging' }
          python packaging/private_delivery.py --platform windows-x64 --installer $installers[0].FullName --resources "$env:RUNNER_TEMP\resources" --lock "$env:RUNNER_TEMP\native-build\dependency-lock.txt" --report "$env:RUNNER_TEMP\native-build\frozen-self-test.json" --report "$env:RUNNER_TEMP\windows-relocation.json" --report "$env:RUNNER_TEMP\installed-probe.json" --output "$env:RUNNER_TEMP\private-delivery"
          if ($LASTEXITCODE -ne 0) { throw 'Private installer evidence staging failed' }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: internal-unsigned-not-for-redistribution-windows-x64-${{ github.run_id }}
          path: ${{ runner.temp }}/private-delivery/*
          retention-days: 7
          compression-level: 0
          if-no-files-found: error
